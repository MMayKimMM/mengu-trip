<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6f0"><title>여순이의 기본 회화 메모 · MENGU TRIP</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f8f6f0;color:#243d44}*{box-sizing:border-box}body{margin:0;padding:18px 14px 60px}.wrap{max-width:630px;margin:auto}.back{display:inline-block;text-decoration:none;color:#286e78;background:#fff;padding:11px 14px;border:1px solid #e3e9e7;border-radius:14px;font-weight:700;margin-bottom:18px}.hero{padding:24px;border-radius:23px;background:#e7f5f4;margin-bottom:18px}.hero h1{font-size:25px;margin:5px 0 10px}.hero p{margin:0;color:#577179;line-height:1.7}.memo{padding:22px 19px;background:white;border:1px solid #e3ebe9;border-radius:22px;margin-bottom:13px;box-shadow:0 5px 16px #1234 0}.memo h2{font-size:18px;line-height:1.55;margin:0 0 17px}.tag{font-weight:800;font-size:12px;color:#267581;margin:18px 0 5px}.jp{font-size:20px;font-weight:700;line-height:1.8;overflow-wrap:anywhere}.reading{line-height:1.8;color:#52717a}.meaning{line-height:1.7;margin:0 0 15px}.copy{background:#237985;color:white;border:none;border-radius:14px;width:100%;min-height:48px;font-size:15px;font-weight:800;cursor:pointer}.copy:focus-visible,.back:focus-visible{outline:3px solid #ffb569;outline-offset:2px}.note{font-size:12px;line-height:1.7;color:#60797f}.toast{position:fixed;z-index:20;left:50%;bottom:calc(25px + env(safe-area-inset-bottom));transform:translate(-50%,15px);background:#193e47;color:white;padding:13px 18px;border-radius:14px;box-shadow:0 8px 24px #0003;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:90%;font-size:14px}.toast.visible{opacity:1;transform:translate(-50%,0)}
</style></head><body><main class="wrap"><a class="back" href="./index.html">← 여행 앱으로</a><header class="hero"><div class="note">MENGU TRIP · 여순이의 일본어 메모</div><h1>💬 기본 회화 메모</h1><p>맹구야! 프런트에서 말하기 어렵다면 일본어를 복사해서 직원에게 보여줘도 좋아. 🥰</p></header><div id="memos"></div><p class="note">한국어 발음은 일본어를 읽기 위한 근사 표기야. 문장 아래의 복사 버튼은 일본어 원문만 복사해.</p></main><div id="toast" role="status" aria-live="polite" class="toast"></div><script>
const items=[
{title:"매일 새 타월 및 어메니티 세트를 받을 수 있나요?",jp:"毎日、新しいタオルとアメニティセットをいただくことはできますか？",reading:"마이니치, 아타라시이 타오루토 아메니티 셋토오 이타다쿠 코토와 데키마스카?",meaning:"매일 새 타월과 어메니티 세트를 받을 수 있나요?"},
{title:"전망이 좋은 방으로 이동하려면 추가 요금이 얼마인가요?",jp:"眺めの良い部屋に変更する場合、追加料金はいくらですか？",reading:"나가메노 요이 헤야니 헨코오스루 바아이, 츠이카 료오킨와 이쿠라데스카?",meaning:"전망이 좋은 방으로 변경할 경우 추가 요금이 얼마인가요?"},
{title:"마지막 날 오전 10시 55분 셔틀버스를 예약하고 싶습니다.",jp:"最終日の午前10時55分発のシャトルバスを予約したいです。",reading:"사이슈우비노 고젠 쥬우지 고쥬우고훈 하츠노 샤토루바스오 요야쿠시타이데스.",meaning:"마지막 날 오전 10시 55분 출발 셔틀버스를 예약하고 싶습니다."}
];
let timer;function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('visible'),2200);}
async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);return true;}}catch(e){}const field=document.createElement('textarea');field.value=value;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.focus();field.select();const ok=document.execCommand('copy');field.remove();return ok;}
const mount=document.getElementById('memos');
items.forEach(item=>{const section=document.createElement('section');section.className='memo';const title=document.createElement('h2');title.textContent=item.title;const jaTag=document.createElement('p');jaTag.className='tag';jaTag.textContent='🇯🇵 일본어';const japanese=document.createElement('div');japanese.className='jp';japanese.lang='ja';japanese.textContent=item.jp;const rTag=document.createElement('p');rTag.className='tag';rTag.textContent='🗣️ 한국어 발음';const reading=document.createElement('div');reading.className='reading';reading.textContent=item.reading;const mTag=document.createElement('p');mTag.className='tag';mTag.textContent='💙 뜻';const meaning=document.createElement('p');meaning.className='meaning';meaning.textContent=item.meaning;const button=document.createElement('button');button.className='copy';button.type='button';button.textContent='📋 일본어만 복사하기';button.addEventListener('click',async()=>{try{const ok=await copyText(item.jp);toast(ok?'일본어 문장을 복사했어! 📋':'복사하지 못했어. 일본어 문장을 길게 눌러 복사해 줘.');}catch(e){toast('복사에 실패했어. 문장을 길게 눌러 복사해 줘.');}});section.append(title,jaTag,japanese,rTag,reading,mTag,meaning,button);mount.append(section);});
</script></body></html>
