<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f0"><title>여행 지출 · MENGU TRIP</title><style>@font-face{font-family:Neo;src:url('./assets/fonts/NanumSquareNeo-Bold.woff2') format('woff2');font-weight:400 700;font-display:swap}@font-face{font-family:Neo;src:url('./assets/fonts/NanumSquareNeo-ExtraBold.woff2') format('woff2');font-weight:800 900;font-display:swap}*{box-sizing:border-box}body{background:#f8f6f0;color:#28474d;font-family:Neo,-apple-system,sans-serif;margin:0;padding:18px 14px 80px}.wrap{max-width:650px;margin:auto}.back{display:inline-block;text-decoration:none;color:#287581;margin:4px 0 18px}.hero{background:#e2f0ed;padding:22px;border-radius:23px}.hero h1{margin:5px 0;font-size:26px}.hero p{font-size:13px;line-height:1.7}.card{background:#fff;border:1px solid #dce8e5;border-radius:18px;padding:18px;margin:13px 0}h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:13px;margin:12px 0 6px}input,select{width:100%;border:1px solid #cbdedb;border-radius:11px;padding:13px;background:white;font:inherit;font-size:15px;color:#28474d}.btn{border:0;border-radius:12px;background:#277b81;color:#fff;padding:13px;font:inherit;cursor:pointer}.btn.secondary{background:#eaf3f0;color:#315b61}.btn.danger{background:#fff0ed;color:#ad4b4b}.row{display:flex;gap:9px}.row>*{flex:1}.small{font-size:12px;color:#698287;line-height:1.6}.totals{font-size:24px;font-weight:900}.item{padding:14px 0;border-top:1px solid #e8eeec}.item:first-child{border-top:0}.item-head{display:flex;justify-content:space-between;gap:12px}.item-name{font-size:16px}.money{text-align:right;white-space:nowrap}.money strong{display:block}.money span{font-size:12px;color:#71878b}.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.dayhead h2{margin:0}.actions{display:flex;gap:8px;margin-top:10px}.actions button{padding:8px 12px;font-size:12px}.empty{color:#71878b;text-align:center;padding:20px}.note{background:#f1f6f4;border-radius:12px;padding:11px;font-size:12px;line-height:1.7}button:focus-visible,input:focus-visible{outline:3px solid #efba85;outline-offset:2px}</style></head><body><div class="wrap"><a class="back" href="./index.html">← 여행 앱으로</a><header class="hero"><div class="small">MENGU TRIP · HIROSHIMA 2026</div><h1>💴 여행 지출</h1><p>엔화로 기록하고 원화로도 확인하자! 데이터는 이 기기에만 저장돼. 영수증 자동 인식은 다음 단계에서 추가할게.</p></header><section class="card"><h2>📊 여행 합계</h2><div class="totals" id="total">¥0</div><div id="krwTotal" class="small"></div><label for="rate">환율 · 100엔당 원화 (직접 입력)</label><input id="rate" type="number" min="0.01" step="0.01" inputmode="decimal" value="900"><p class="small">입력 당시 환율이 각 지출에 저장돼. 변경 후 새 지출부터 적용돼.</p></section><section class="card"><h2 id="formTitle">✏️ 지출 기록하기</h2><form id="form"><label for="date">날짜</label><input id="date" type="date" required><label for="name">지출처 · 한국어 이름</label><input id="name" required maxlength="100" placeholder="예: 세븐일레븐"><label for="original">일본어 상호 (선택)</label><input id="original" maxlength="120" placeholder="예: セブン-イレブン"><label for="amount">지출 금액 (엔 ¥)</label><input id="amount" type="number" min="1" step="1" inputmode="numeric" required placeholder="예: 1280"><label for="memo">메모 (선택)</label><input id="memo" maxlength="200" placeholder="예: 간식, 저녁식사"><div class="row" style="margin-top:14px"><button class="btn" id="save" type="submit">지출 저장</button><button class="btn secondary" type="button" id="cancel" hidden>수정 취소</button></div></form></section><section class="card"><div class="row"><button class="btn secondary" id="export" type="button">📦 JSON 백업</button><button class="btn secondary" id="importBtn" type="button">📥 백업 불러오기</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><p class="small">다른 여행 기록이나 집사 편지 데이터는 건드리지 않아. 백업은 지출 내역만 포함해.</p></section><section id="list"></section></div><script>
'use strict';const $=id=>document.getElementById(id),KEY='mengu-trip-expenses-v1',RATE='mengu-trip-expense-rate-v1';let items=[],editing=null;const yen=n=>'¥'+Math.round(n).toLocaleString('ko-KR'),won=n=>'약 '+Math.round(n).toLocaleString('ko-KR')+'원';const today=()=>new Date().toLocaleDateString('sv-SE');function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');items=Array.isArray(v)?v.filter(x=>x&&typeof x.id==='string'&&Number.isFinite(+x.amount)&&+x.amount>0):[];}catch{items=[];}const r=+localStorage.getItem(RATE);if(Number.isFinite(r)&&r>0)$('rate').value=r;$('date').value=today();render();}function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true;}catch(e){alert('저장에 실패했어. 저장 공간을 확인해 줘.');return false;}}function rate(){const r=Number($('rate').value);return Number.isFinite(r)&&r>0?r:900;}function formatDay(d){return d.replace(/-/g,'. ')}function render(){const total=items.reduce((a,b)=>a+Number(b.amount),0),krw=items.reduce((a,b)=>a+Number(b.amount)*Number(b.rate)/100,0);$('total').textContent=yen(total);$('krwTotal').textContent=won(krw)+' · '+items.length+'건';const root=$('list');root.replaceChildren();const days=[...new Set(items.map(x=>x.date))].sort().reverse();if(!days.length){const e=document.createElement('section');e.className='card empty';e.textContent='아직 지출 내역이 없어. 첫 영수증을 기록해 볼까? 🧾';root.append(e);return;}days.forEach(date=>{const dayItems=items.filter(x=>x.date===date),box=document.createElement('section');box.className='card';const head=document.createElement('div');head.className='dayhead';const title=document.createElement('h2');title.textContent='📅 '+formatDay(date);const subtotal=document.createElement('strong');subtotal.textContent=yen(dayItems.reduce((a,b)=>a+Number(b.amount),0));head.append(title,subtotal);box.append(head);dayItems.forEach(item=>{const row=document.createElement('div');row.className='item';const top=document.createElement('div');top.className='item-head';const info=document.createElement('div');const nm=document.createElement('strong');nm.className='item-name';nm.textContent=item.name;info.append(nm);if(item.original){const j=document.createElement('div');j.className='small';j.textContent=item.original;info.append(j);}if(item.memo){const m=document.createElement('div');m.className='small';m.textContent=item.memo;info.append(m);}const cost=document.createElement('div');cost.className='money';const y=document.createElement('strong');y.textContent=yen(item.amount);const k=document.createElement('span');k.textContent=won(item.amount*item.rate/100);cost.append(y,k);top.append(info,cost);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='수정';edit.onclick=()=>startEdit(item.id);const del=document.createElement('button');del.className='btn danger';del.textContent='삭제';del.onclick=()=>{if(confirm(item.name+' 지출을 삭제할까?')){const next=items.filter(x=>x.id!==item.id);const old=items;items=next;if(!save())items=old;render();}};actions.append(edit,del);row.append(top,actions);box.append(row);});root.append(box);});}function startEdit(id){const item=items.find(x=>x.id===id);if(!item)return;editing=id;for(const key of ['date','name','original','amount','memo'])$(key).value=item[key]??'';$('formTitle').textContent='✏️ 지출 수정하기';$('save').textContent='수정 저장';$('cancel').hidden=false;document.getElementById('form').scrollIntoView({behavior:'smooth',block:'start'});}function reset(){editing=null;$('form').reset();$('date').value=today();$('formTitle').textContent='✏️ 지출 기록하기';$('save').textContent='지출 저장';$('cancel').hidden=true;}$('form').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value),r=rate(),date=$('date').value,name=$('name').value.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!name||!Number.isSafeInteger(amount)||amount<1||!Number.isFinite(r)||r<=0){alert('날짜, 지출처, 금액, 환율을 확인해 줘.');return;}const prev=items;const old=editing?items.find(x=>x.id===editing):null;const item={id:old?.id||('e-'+Date.now()+'-'+Math.random().toString(36).slice(2)),date,name,original:$('original').value.trim(),amount,memo:$('memo').value.trim(),rate:old?.rate??r};items=old?items.map(x=>x.id===old.id?item:x):[...items,item];if(!save()){items=prev;return;}reset();render();};$('cancel').onclick=reset;$('rate').onchange=()=>{const r=Number($('rate').value);if(!Number.isFinite(r)||r<=0){alert('환율은 0보다 커야 해.');return;}try{localStorage.setItem(RATE,String(r));}catch(e){alert('환율 저장에 실패했어.');}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'MENGU TRIP',type:'expenses',version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='mengu-trip-expenses-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.type!=='expenses'||!Array.isArray(data.items))throw Error('지출 백업 파일이 아니야');const valid=data.items.filter(x=>x&&typeof x.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.name==='string'&&Number.isSafeInteger(Number(x.amount))&&Number(x.amount)>0&&Number.isFinite(Number(x.rate))&&Number(x.rate)>0);if(valid.length!==data.items.length)throw Error('일부 항목의 데이터가 잘못됐어');if(!confirm('현재 지출 '+items.length+'건을 백업 '+valid.length+'건으로 교체할까?'))return;const old=items;items=valid;if(!save()){items=old;return;}reset();render();alert('지출 내역을 불러왔어!');}catch(err){alert('불러오지 못했어: '+err.message);}finally{e.target.value='';}};load();
</script></body></html>
