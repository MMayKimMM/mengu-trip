</style></head><body><main class="wrap"><a class="back" href="./index.html">← 여행 앱으로</a><header class="hero"><div class="minor">MENGU TRIP · 여순이와 함께</div><h1>🌿 맹구의 마음 쉼터</h1><p>무서운 생각이 올라오거나 지루하고 답답할 때, 지금 하고 싶은 것을 하나만 골라봐. 쉬어 가도 되고 중간에 멈춰도 돼. 💙</p></header><div id="menu" class="card"><button class="btn" data-mode="reassure">💙 한 번 확인하고 안심하기</button><button class="btn alt" data-mode="game">🧩 여행 짝 맞추기 · 최고 기록</button><button class="btn alt" data-mode="hammer">🔨 불안 생각 꽝! · 10라운드</button><button class="btn" data-mode="thought">🧠 불안한 생각 살펴보기</button><button class="btn alt" data-mode="companion">🎧 여순이의 3분 동행</button><button class="btn alt" data-mode="senses">🖐️ 오감 찾기 미니게임</button></div><div class="card hide" id="panel"></div><p class="minor">이 기능은 마음을 정리하는 자기관리 보조 도구이지 진단이나 치료가 아니야. 평소와 다른 심한 흉통, 실신, 심한 호흡곤란 등 응급 증상이 있으면 공황으로 단정하지 말고 승무원·주변 사람에게 도움을 요청해. 한국에서는 119, 일본에서는 구급 119야.</p></main><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
const $=id=>document.getElementById(id);let mode='',step=0,timer=null,seconds=180,paused=false;const panel=$('panel'),menu=$('menu');
function h(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e;}
function button(label,callback,alt=false){const b=h('button','btn'+(alt?' alt':''),label);b.type='button';b.onclick=callback;return b;}
function toast(message){$('toast').textContent=message;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800);}
function stopTimer(){if(timer!==null)clearInterval(timer);timer=null;}
function exit(){stopTimer();stopHammer();gameDeck=[];gamePick=[];mode='';step=0;panel.classList.add('hide');menu.classList.remove('hide');}
function open(x){exit();mode=x;menu.classList.add('hide');panel.classList.remove('hide');step=0;render();}

const comfort=[
'맹구야, 불안이 크게 느껴져도 그 느낌이 곧 위험하다는 증거는 아니야. 지금은 의자에 등을 기대고 쉬어보자.',
'공황발작은 무섭고 강렬하지만 발작 자체는 일반적으로 생명을 위협하지 않는 것으로 알려져 있어. 다만 새로운 증상은 별도로 살펴야 해.',
'두려움이 “혹시 큰일 나는 거 아닐까?”라고 말해도 그것은 생각이지 의학적 판정이 아니야. 확인한 다음에는 지금 할 일을 고르자.',
'심장 박동에 온 신경이 모이면 작은 변화도 크게 느껴질 수 있어. 반복 확인 대신 바깥 풍경 하나를 찾아볼까?',
'불안이 즉시 사라지지 않아도 괜찮아. 편안한 자세로 시간을 보내는 것만으로도 충분해.',
'발바닥이 닿는 곳, 손에 닿는 천의 감촉. 지금 여기의 작은 사실 두 가지만 느껴보자.',
'맹구가 지금 느끼는 두려움은 진짜 감정이야. 그렇지만 두려움의 크기가 위험의 크기를 말해주지는 않아.',
'몸 상태를 확인했다면 1분 뒤에도 같은 질문을 반복하지 않아도 돼. 우리 머리를 다른 곳으로 돌려보자.',
'눈앞의 작은 색깔 세 가지를 골라보자. 여행 앱의 푸른색도 하나의 단서야.',
'불안을 없애는 시험이 아니야. 조금 불안한 채로도 게임 한 판을 해볼 수 있어.',
'“무섭다”는 생각이 떠오르면 “무섭다는 생각이 올라왔구나” 하고 이름을 붙여보자.',
'방구에게 잠시 곁에 있어달라고 말해도 괜찮아. 도움 요청은 좋은 선택이야.',
'불안이 파도처럼 오가더라도 맹구는 지금 한 장의 편지를 읽고 있어. 다음 편지로 넘어가 보자.',
'지금 여기에서 해야 할 일은 모든 미래를 예측하는 게 아니라 편안하게 앉아 다음 순간을 맞이하는 거야.',
'약의 효과나 부작용을 마음으로 판정할 수는 없어. 약이 걱정되면 처방 의료진이나 약사에게 확인하는 게 정확해.',
'무섭고 답답해도 숨을 일부러 크게 들이쉬거나 오래 참지 말고 자연스럽게 쉬어보자.',
'오늘의 여행은 불안이 하나도 없어야 성공하는 여행이 아니야. 필요한 도움을 받으며 이어가도 돼.',
'지금 해 볼 작은 일: 손가락으로 여행의 색깔을 다섯 개 찾아보자.',
'몸을 계속 검사해야 안전해지는 것은 아니야. 확인은 한 번만 하고 나머지 시간은 원하는 활동에 써보자.',
'여순이의 한마디: 맹구야, 지금은 6,133개의 편지가 아니라 이 한 문장만 읽어도 좋아. 💙'
];
let comfortQueue=[],comfortLast=-1,checkAnswers={},gameDeck=[],gamePick=[],gameSolved=0,gameTurns=0;
function nextComfort(){
 if(!comfortQueue.length){comfortQueue=comfort.map((_,i)=>i);for(let i=comfortQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[comfortQueue[i],comfortQueue[j]]=[comfortQueue[j],comfortQueue[i]];}if(comfortQueue.length>1&&comfortQueue[comfortQueue.length-1]===comfortLast){[comfortQueue[0],comfortQueue[comfortQueue.length-1]]=[comfortQueue[comfortQueue.length-1],comfortQueue[0]];}}
 comfortLast=comfortQueue.pop();return comfort[comfortLast];
}
function drawReassure(){
 panel.append(h('h2','','💙 한 번 확인하고 안심하기'));
 panel.append(h('p','minor','이 문항은 응급 신호를 놓치지 않기 위한 한 번의 점검이야. 모두 괜찮아도 위험이 0이라고 보증하는 검사는 아니야.'));
 if(step===0){
 const checks=[
 ['clear','의식이 또렷하고 평소처럼 응답할 수 있나요?'],
 ['breath','숨을 편하게 쉴 수 있나요?'],
 ['chest','새롭거나 심한 가슴 통증이 없나요?'],
 ['faint','실신했거나 곧 쓰러질 것 같은 느낌이 없나요?'],
 ['med','처방된 용법보다 약을 많이 복용하지 않았나요?']
 ];
 checks.forEach(([key,label])=>{
 const p=h('p','text',label),r=h('div','row'),yes=button('네',()=>{checkAnswers[key]=true;drawReassureRefresh();},true),no=button('아니요 / 잘 모르겠어요',()=>{checkAnswers[key]=false;drawReassureRefresh();},true);
 if(checkAnswers[key]===true)yes.style.background='#c6ebe2';
 if(checkAnswers[key]===false)no.style.background='#fae0d9';
 r.append(yes,no);panel.append(p,r);
 });
 panel.append(button('확인했어요 →',()=>{step=1;render();}));
 return;
 }
 const all=Object.values(checkAnswers).length===5&&Object.values(checkAnswers).every(Boolean);
 if(!all){
 panel.append(h('div','tile','⚠️ 응답 중 확인이 필요하거나 아직 답하지 않은 항목이 있어. 지금은 안심 문구보다 의료진·승무원에게 증상을 알리는 게 우선이야. 심한 증상이 있으면 현지 응급 도움을 요청해.'));
 panel.append(h('p','minor','특히 실신, 심한 가슴 통증, 뚜렷한 호흡곤란, 의식 변화, 처방 초과 복용이 있다면 스스로 공황이라고 단정하지 마.'));
 panel.append(button('다시 확인',()=>{step=0;render();},true));
 }else{
 panel.append(h('div','tile','🌿 지금 답변에서는 뚜렷한 경고 신호를 선택하지 않았어. 이는 의학적 안전 판정은 아니지만, 같은 질문을 반복하기보다 잠시 다른 활동으로 주의를 옮길 수 있어.'));
 const msg=h('div','tile large',nextComfort());panel.append(msg);
 panel.append(button('💌 다른 여순이의 한마디',()=>{msg.textContent=nextComfort();}));
 panel.append(button('🧩 여행 짝 맞추기 게임',()=>open('game'),true));
 panel.append(h('p','minor','복용 약의 안전은 개인의 용량·조합·건강 상태에 따라 달라져. 새로운 증상이 나타나거나 악화하면 확인을 반복하지 말고 의료 도움을 요청해.'));
 }
}
function drawReassureRefresh(){render();}
const icons=['⛩️','🦌','🍋','🛍️','🍡','🚋','🦪','🌸','♨️','🍣','📚','🐇'];
let gameStarted=0,gameFinished=false,gameClock=null,gameTime=0;
const recordKey='mengu-memory-rank-v1';
function getRecords(){try{return JSON.parse(localStorage.getItem(recordKey)||'[]');}catch{return [];}}
function bestTime(){return getRecords()[0]?.time;}
function duration(v){return (v/1000).toFixed(1)+'초';}
function resetGame(){
 const take=icons.slice().sort(()=>Math.random()-.5).slice(0,6);
 gameDeck=[...take,...take].map((symbol,i)=>({id:i,symbol,shown:false,matched:false}));
 for(let i=gameDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[gameDeck[i],gameDeck[j]]=[gameDeck[j],gameDeck[i]];}
 gamePick=[];gameSolved=0;gameTurns=0;gameStarted=performance.now();gameFinished=false;step=0;
}
function drawGame(){
 if(!gameDeck.length)resetGame();
 panel.append(h('h2','','🧩 여행 기억 짝 맞추기'),h('p','minor','6쌍을 가장 빨리 맞혀봐! 기록은 이 기기에만 저장돼. 중간에 쉬어도 괜찮아.')); const best=bestTime();if(best!==undefined)panel.append(h('div','tile','🏆 최고 기록 '+duration(best)));const live=h('p','status','⏱ 0.0초');panel.append(live);if(!gameFinished){const update=()=>{if(mode==='game'&&gameStarted&&!gameFinished&&live.isConnected)live.textContent='⏱ '+duration(performance.now()-gameStarted);};gameClock=live;update();}
 const score=h('p','text','찾은 짝 '+gameSolved+' / 6 · 시도 '+gameTurns+'회');panel.append(score);
 const board=h('div','');board.style.display='grid';board.style.gridTemplateColumns='repeat(3,minmax(0,1fr))';board.style.gap='9px';
 gameDeck.forEach(item=>{
 const tile=button(item.shown||item.matched?item.symbol:'❔',()=>pickGame(item.id),true);
 tile.style.textAlign='center';tile.style.minHeight='78px';tile.style.fontSize='30px';tile.setAttribute('aria-label',item.shown||item.matched?'카드 '+item.symbol:'뒤집지 않은 카드');
 if(item.matched){tile.style.background='#cbe9dd';tile.disabled=true;}
 board.append(tile);
 });panel.append(board);
 if(gameSolved===6){panel.append(h('div','tile','🎉 완성! '+duration(gameTime)+' · 여섯 짝을 찾았어!')); const ranks=getRecords();panel.append(h('h3','','🏆 내 시간 순위'));ranks.forEach((rec,i)=>panel.append(h('p','minor',(i+1)+'위 · '+duration(rec.time)+' · '+rec.date)));panel.append(button('다시 한 판',()=>{resetGame();render();}));}
 else panel.append(button('새 게임 시작',()=>{resetGame();render();},true));
}
let turnLock=false;
function pickGame(id){
 if(turnLock||mode!=='game'||gamePick.length>=2)return;
 const card=gameDeck.find(x=>x.id===id);if(!card||card.shown||card.matched)return;
 card.shown=true;gamePick.push(card.id);
 if(gamePick.length===2){
  gameTurns++;const [a,b]=gamePick.map(x=>gameDeck.find(c=>c.id===x));
  if(a.symbol===b.symbol){a.matched=b.matched=true;gameSolved++;gamePick=[];if(gameSolved===6&&!gameFinished){gameFinished=true;gameTime=performance.now()-gameStarted;try{const ranks=getRecords();ranks.push({time:Math.round(gameTime),date:new Date().toLocaleDateString('ko-KR')});ranks.sort((x,y)=>x.time-y.time);localStorage.setItem(recordKey,JSON.stringify(ranks.slice(0,10)));}catch(e){}}render();}
  else {turnLock=true;render();setTimeout(()=>{if(mode==='game'){a.shown=false;b.shown=false;gamePick=[];turnLock=false;render();}else{turnLock=false;gamePick=[];}},850);}
 }else render();
}
