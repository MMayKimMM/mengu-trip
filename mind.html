<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6f0"><title>맹구의 마음 쉼터 · MENGU TRIP</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f8f6f0;color:#243d44}*{box-sizing:border-box}body{margin:0;padding:18px 14px 70px}.wrap{max-width:620px;margin:auto}.back{display:inline-block;text-decoration:none;color:#286e78;background:white;padding:11px 14px;border:1px solid #e3e9e7;border-radius:14px;font-weight:700;margin-bottom:16px}.hero{background:#e7f5f4;border-radius:23px;padding:23px}.hero h1{font-size:25px;margin:6px 0}.hero p{margin:0;color:#56747a;line-height:1.7}.card{background:#fff;border:1px solid #e3ebe9;border-radius:20px;padding:20px;margin:13px 0}.card h2{font-size:20px;margin:0 0 13px}.btn{border:0;background:#247985;color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:800;width:100%;text-align:left;cursor:pointer;margin:6px 0}.btn.alt{background:#eff5f3;color:#245c65}.btn:focus-visible{outline:3px solid #ffb569;outline-offset:2px}.text{line-height:1.85;color:#385b62}.minor{font-size:13px;color:#657e85;line-height:1.65}.hide{display:none}.large{font-size:22px;font-weight:750;line-height:1.7}.meter{height:7px;background:#e7efec;border-radius:99px;margin:14px 0;overflow:hidden}.meter>div{height:100%;background:#75b3aa;transition:width .3s}.row{display:flex;gap:9px}.row>*{flex:1}.field{width:100%;font:inherit;padding:12px;border:1px solid #cfdedc;border-radius:12px;background:white}.circle{height:120px;width:120px;border-radius:50%;background:#d6ede6;margin:12px auto;display:grid;place-items:center;font-size:35px}.status{text-align:center;font-size:13px;color:#608078;line-height:1.7}.tile{background:#f1f7f5;border-radius:12px;padding:17px;margin:10px 0;font-weight:650;line-height:1.7}button:disabled{opacity:.5}.toast{position:fixed;bottom:calc(25px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);padding:11px 16px;border-radius:12px;background:#244950;color:#fff;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body><main class="wrap"><a class="back" href="./index.html">← 여행 앱으로</a><header class="hero"><div class="minor">MENGU TRIP · 여순이와 함께</div><h1>🌿 맹구의 마음 쉼터</h1><p>무서운 생각이 올라오거나 지루하고 답답할 때, 지금 하고 싶은 것을 하나만 골라봐. 쉬어 가도 되고 중간에 멈춰도 돼. 💙</p></header><div id="menu" class="card"><button class="btn" data-mode="thought">🧠 불안한 생각 살펴보기</button><button class="btn alt" data-mode="companion">🎧 여순이의 3분 동행</button><button class="btn alt" data-mode="senses">🖐️ 오감 찾기 미니게임</button></div><div class="card hide" id="panel"></div><p class="minor">이 기능은 마음을 정리하는 자기관리 보조 도구이지 진단이나 치료가 아니야. 평소와 다른 심한 흉통, 실신, 심한 호흡곤란 등 응급 증상이 있으면 공황으로 단정하지 말고 승무원·주변 사람에게 도움을 요청해. 한국에서는 119, 일본에서는 구급 119야.</p></main><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
const $=id=>document.getElementById(id);let mode='',step=0,timer=null,seconds=180,paused=false;const panel=$('panel'),menu=$('menu');
function h(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e;}
function button(label,callback,alt=false){const b=h('button','btn'+(alt?' alt':''),label);b.type='button';b.onclick=callback;return b;}
function toast(message){$('toast').textContent=message;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800);}
function stopTimer(){if(timer!==null)clearInterval(timer);timer=null;}
function exit(){stopTimer();mode='';step=0;panel.classList.add('hide');menu.classList.remove('hide');}
function open(x){exit();mode=x;menu.classList.add('hide');panel.classList.remove('hide');step=0;render();}
const worries=[
{label:'비행기나 기차에서 못 내릴까 봐 무서워',fact:'지금 확인할 수 있는 사실은 무엇일까? 나는 좌석에 있고, 필요한 경우 승무원에게 도움을 요청할 수 있어.',alternative:'불편한 느낌이 올라와도 지금 당장 모든 상황을 해결할 필요는 없어. 다음 1분에 할 일 하나만 골라보자.',action:'등받이에 몸을 기대고 발이 닿는 바닥을 느껴보기'},
{label:'몸에 느껴지는 변화가 너무 신경 쓰여',fact:'느낌과 그 느낌의 원인은 같지 않아. 느낌만으로 무슨 일이 일어날지 결론 내릴 수는 없어.',alternative:'지금 상태가 평소와 다른지 살피고, 낯설거나 심한 증상이 있으면 도움을 요청하자.',action:'몸을 반복해 검사하기보다 주변 사람에게 필요한 도움 말하기'},
{label:'불안이 오래 지속되면 어떡하지?',fact:'불안의 길이를 미리 정확하게 알 수는 없어. 하지만 지금 몇 분을 어떻게 보낼지는 선택할 수 있어.',alternative:'반드시 즉시 진정해야 하는 건 아니야. 불안해도 가능한 작은 행동을 하나 해볼 수 있어.',action:'물 한 모금 마시거나 손에 쥔 물건의 감촉 느끼기'},
{label:'내가 너무 긴장해 보여서 창피해',fact:'다른 사람이 나를 어떻게 생각하는지는 지금 확실히 알기 어려워.',alternative:'편안하게 보이려고 애쓰기보다 내 몸과 마음을 돌보는 게 우선이야.',action:'방구나 동행자에게 “지금 조금 긴장돼”라고 말하기'},
{label:'그냥 설명하기 어려운 걱정이 있어',fact:'걱정이 떠올랐다는 사실과 실제 위험이 있다는 판단은 구분할 수 있어.',alternative:'불확실성을 완전히 없애지 않아도 지금 할 수 있는 작은 선택이 있어.',action:'주변의 색깔 세 가지 찾아보기'}
];
function render(){panel.replaceChildren();panel.append(button('← 다른 활동 선택',exit,true));if(mode==='thought')drawThought();if(mode==='companion')drawCompanion();if(mode==='senses')drawSenses();}
function drawThought(){panel.append(h('h2','', '🧠 불안한 생각 살펴보기'),h('p','text','불안을 억지로 없애지 말고, 걱정과 확인할 수 있는 사실을 천천히 나눠보자.'));if(step===0){panel.append(h('p','minor','어떤 걱정이 가장 가까워?'));worries.forEach((w,i)=>panel.append(button(w.label,()=>{step=i+1;render()},true)));return;}const w=worries[step-1];panel.append(h('div','tile','💭 떠오른 생각: '+w.label),h('div','tile','🔎 확인할 수 있는 것\n'+w.fact),h('div','tile','🌱 다른 관점\n'+w.alternative),h('div','tile','🧸 지금 해볼 작은 행동\n'+w.action));panel.append(button('다른 걱정 살펴보기',()=>{step=0;render();},true));}
const script=[
'맹구야, 여순이 여기 있어. 지금 무언가를 잘 해내야 하는 시간은 아니야.',
'등받이에 몸을 기대어 봐. 지금 닿아 있는 부분만 가볍게 느껴보자.',
'숨을 억지로 크게 쉬거나 참지 말고 평소처럼 편안하게 호흡해.',
'창밖을 봐도 좋고 안 봐도 좋아. 맹구가 더 편안한 쪽을 골라.',
'손바닥이나 옷감의 감촉을 느껴볼까? 불안을 분석하려 애쓰지 않아도 돼.',
'이 3분은 잘 버텼는지 시험하는 시간이 아니야. 그냥 지나가는 시간이야.',
'원한다면 방구에게 잠깐 손을 잡아달라고 부탁해도 좋아.',
'몸을 조금 편한 방향으로 움직여도 좋아. 긴장을 풀려고 억지로 애쓰진 말자.',
'이 순간에 필요한 게 물인지, 휴식인지, 도움이 필요한지 살펴보자.',
'모든 느낌을 설명할 필요 없어. 지금 가능한 작은 행동만 해도 충분해.',
'여순이가 준비한 글을 천천히 읽어봐. 중간에 쉬어 가도 괜찮아.',
'맹구야, 여기까지 왔네. 지금도 도움을 요청할 수 있고, 다음 순간을 선택할 수 있어.'
];
function drawCompanion(){panel.append(h('h2','','🎧 여순이의 3분 동행'));const display=h('div','circle','💙'),clock=h('div','status','');const message=h('div','tile large','');const meter=h('div','meter');const fill=h('div');meter.append(fill);panel.append(display,clock,message,meter);function sync(){const index=Math.min(script.length-1,Math.floor((180-seconds)/15));clock.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')+(paused?' · 잠시 쉬는 중':'');message.textContent=script[index];fill.style.width=((180-seconds)/180*100)+'%';}
const controls=h('div','row');controls.append(button(paused?'계속하기':'잠깐 멈추기',()=>{paused=!paused;stopTimer();if(!paused)run();render();},true),button('처음부터',()=>{stopTimer();seconds=180;paused=false;render();},true));panel.append(controls);if(seconds===0){message.textContent='세 분이 지났어! 이 시간을 보내준 맹구에게 고마워. 💙';panel.append(button('다시 3분 시작',()=>{seconds=180;paused=false;render();}));return;}sync();function run(){stopTimer();timer=setInterval(()=>{if(mode!=='companion'){stopTimer();return;}seconds=Math.max(0,seconds-1);sync();if(seconds===0){stopTimer();render();}},1000);}if(!paused)run();}
const senseSteps=[
['👀 보이는 것','눈앞에 보이는 물건 세 가지를 찾아보자. 색깔이나 모양만 떠올려도 돼.'],
['👂 들리는 것','귀에 들리는 소리 두 가지를 찾아보자. 조용하면 조용함 자체도 괜찮아.'],
['✋ 닿는 감각','옷감, 의자, 손바닥에 닿는 감촉 한 가지를 느껴보자.'],
['🌸 냄새','느껴지는 냄새가 있을까? 없다면 그냥 건너뛰어도 돼.'],
['🍬 맛','입안에 남은 맛이 느껴질까? 아무것도 없다면 건너뛰어도 괜찮아.']
];
function drawSenses(){panel.append(h('h2','','🖐️ 오감 찾기'));const item=senseSteps[step];panel.append(h('p','minor',(step+1)+' / '+senseSteps.length+' · 정답은 없어. 건너뛰어도 괜찮아.'));panel.append(h('div','tile large',item[0]),h('p','text',item[1]));const field=h('textarea','field');field.rows=2;field.placeholder='떠오른 걸 적어도 좋고, 그냥 다음으로 가도 돼';panel.append(field);panel.append(button(step===senseSteps.length-1?'마치기 💙':'다음 감각 →',()=>{if(step===senseSteps.length-1){panel.replaceChildren(button('← 다른 활동 선택',exit,true),h('h2','','🌿 잘했어, 맹구야!'),h('p','text','감각을 모두 찾지 못했어도 괜찮아. 원하면 언제든 다시 해보자.'),button('오감 찾기 다시 시작',()=>{step=0;render();}));}else{step++;render();}}));if(step>0)panel.append(button('이전으로',()=>{step--;render();},true));}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{seconds=180;paused=false;open(b.dataset.mode);});window.addEventListener('pagehide',stopTimer);
</script></body></html>
