<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>여순이의 히로시마 맛집 · MENGU TRIP</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f8f6f0;color:#243d44}*{box-sizing:border-box}body{margin:0;padding:18px 14px 50px}.wrap{max-width:660px;margin:auto}.back{display:inline-block;text-decoration:none;color:#286e78;background:white;padding:11px 14px;border:1px solid #e3e9e7;border-radius:14px;font-weight:700;margin-bottom:16px}.hero{padding:24px;border-radius:23px;background:#e7f5f4}.hero h1{font-size:25px;margin:5px 0 9px}.hero p{margin:0;line-height:1.65;color:#56747a}.filters{display:flex;gap:7px;overflow:auto;padding:15px 0}.chip{white-space:nowrap;border:1px solid #d8e4e3;background:white;border-radius:999px;padding:11px 13px;color:#325f67;font-weight:700}.chip.sel{background:#237985;color:white}.restaurant{border:1px solid #e4eeeb;border-radius:20px;background:#fff;padding:20px;margin-bottom:12px}.restaurant h2{font-size:19px;margin:0 0 4px;line-height:1.5}.ko{color:#687c81;font-size:14px;margin:0 0 13px}.tag{font-size:12px;color:#267581;font-weight:800;margin:12px 0 5px}.copy{color:#34565e;line-height:1.75;margin:0}.map{display:block;text-align:center;text-decoration:none;background:#237985;color:white;border-radius:13px;padding:14px;font-weight:800;margin-top:15px}.muted{background:#f4f6f5;border-radius:12px;padding:12px;color:#60767b;margin-top:15px;font-size:13px}.foot{font-size:12px;color:#647982;line-height:1.65}</style></head><body><main class="wrap"><a class="back" href="./index.html">← 여행 앱으로</a><header class="hero"><p>🍣 여순이의 여행 먹거리 수첩</p><h1>히로시마 맛집 모음</h1><p>맹구야! 먹고 싶은 종류로 골라서 구글맵을 바로 열어봐. 💙</p></header><nav id="filters" class="filters" aria-label="음식 종류 선택"></nav><div id="list"></div><p class="foot">주소가 있는 식당은 Google 지도에서 이름과 주소를 함께 검색해. 원본 지도 공유 링크가 아니므로 검색 결과에서 상호·위치를 다시 확인해줘. 영업시간과 휴무는 변동 가능해.</p></main><script>const places=[{"id":1,"name":"すし辰 ekie店","ko":"스시타츠 ekie점","category":"🍣 스시","area":"히로시마역 ekie","address":"広島県広島市南区松原町1-2","recommend":"세토우치 생선 · 도미 · 제철초밥","memo":"히로시마역에서 먹기 좋은 회전초밥. 영업시간은 방문 전 확인"},{"id":2,"name":"長崎堂","ko":"나가사키도","category":"🍰 디저트","area":"나카마치","address":"広島県広島市中区中町3-24","recommend":"버터케이크","memo":"오전 방문 추천. 당일 매진 시 조기 종료 가능. 현금 결제와 휴무일은 방문 전 확인"},{"id":3,"name":"広島アンデルセン","ko":"히로시마 안데르센","category":"🍰 디저트","area":"혼도리","address":"広島市中区本通7-1","recommend":"빵 · 구움과자 · 델리 · 선물용 과자","memo":"혼도리 쇼핑 도중 들르기 좋은 베이커리"},{"id":4,"name":"맹구가 찾은 오반자이집 🥰","ko":"비밀 오반자이집","category":"🍚 가정식","area":"위치 확인 필요","address":"","recommend":"명란 다시마키 · 은대구 된장구이 · 세세리 마늘볶음 · 도미 다시마 볶음밥 · 사케","memo":"맹구가 술 마시러 가고 싶어 한 가게! 원본 지도 URL이 현재 메시지에서 누락되어 링크 확인 필요"},{"id":5,"name":"わたしの食卓 紙屋町店","ko":"와타시노 쇼쿠타쿠","category":"🍚 가정식","area":"가미야초","address":"広島県広島市中区紙屋町2丁目2-6","recommend":"고등어 정식 · 가라아게 · 카레 · 굴튀김 정식","memo":"빠르고 저렴한 일본식 정식"},{"id":6,"name":"まいどおおきに 広島袋町食堂","ko":"히로시마 후쿠로마치 식당","category":"🍚 가정식","area":"후쿠로마치","address":"広島県広島市中区袋町2-20","recommend":"생선구이 · 계란말이 · 돈지루 · 조림","memo":"쟁반 들고 반찬을 골라 만드는 나만의 집밥 세트"},{"id":7,"name":"AGRI","ko":"AGRI","category":"🍚 가정식","area":"나카마치","address":"広島市中区中町4-18 エスポアールビル1F","recommend":"오반자이 반찬 · 채소요리","memo":"여행 중 가볍게 먹기 좋은 집밥. 저녁 예약 운영 여부 사전 확인"},{"id":8,"name":"和久バル","ko":"와큐바루","category":"🦪 히로시마 음식","area":"히로시마역 ekie 2F","address":"広島市南区松原町1-2 ekie 2F","recommend":"굴 바질 오일 파스타 · 굴 크림리조또 · 가키후라이","memo":"익힌 굴요리를 먹고 싶을 때"},{"id":9,"name":"おっくん堂","ko":"오쿤도","category":"🍜 면요리","area":"나카덴마에","address":"広島市中区大手町3丁目3-3 さんさんビル1F","recommend":"마제멘","memo":"나카덴마에역 근처. 영업시간 확인"}];let selected='전체';const filter=document.getElementById('filters'),list=document.getElementById('list');function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}function draw(){const cats=['전체',...new Set(places.map(p=>p.category))];filter.replaceChildren(...cats.map(c=>{const b=el('button','chip'+(c===selected?' sel':''),c);b.type='button';b.onclick=()=>{selected=c;draw();};return b;}));list.replaceChildren(...places.filter(p=>selected==='전체'||selected===p.category).map(p=>{const box=el('article','restaurant');box.append(el('h2','',p.name),el('p','ko',p.ko+' · '+p.category+' · '+p.area));const t1=el('div','tag','📍 주소');box.append(t1,el('p','copy',p.address||'원본 링크 확인 필요'));box.append(el('div','tag','🍴 추천 메뉴'),el('p','copy',p.recommend),el('div','tag','💙 메모'),el('p','copy',p.memo));if(p.address){const a=el('a','map','📍 Google 지도에서 찾기 ↗');a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+' '+p.address);a.target='_blank';a.rel='noopener noreferrer';box.append(a);}else{box.append(el('p','muted','🔒 맹구가 찾은 오반자이집 — 원본 구글맵 URL 확인 후 추가 예정'));}return box;}));}draw();</script></body></html>
