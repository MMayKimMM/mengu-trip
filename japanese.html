let category='전체',pool=[],current=null,correct=0,attempts=0,lastId=null;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function resetPool(){pool=shuffle(questions.filter(x=>category==='전체'||x.cat===category).map(x=>x.id));if(pool.length>1&&pool[pool.length-1]===lastId){[pool[0],pool[pool.length-1]]=[pool[pool.length-1],pool[0]];}}
function renderFilters(){let cats=['전체',...new Set(questions.map(q=>q.cat))];$('filters').replaceChildren(...cats.map(c=>{const b=document.createElement('button');b.className='filter'+(c===category?' sel':'');b.textContent=c;b.type='button';b.onclick=()=>{category=c;resetPool();renderFilters();nextQ()};return b;}));}
function nextQ(){questionMistakes=0;solved=false;$('dialog').hidden=true;if(!pool.length)resetPool();current=questions.find(x=>x.id===pool.pop());lastId=current.id;const choices=shuffle([current.a,current.b,current.c].map((pair,i)=>({pair,isCorrect:i===0})));$('progress').textContent=current.cat+' · '+questions.filter(x=>category==='전체'||x.cat===category).length+'문제 중 랜덤';$('score').textContent='정답 '+correct+' / '+attempts;$('fill').style.width=(attempts?Math.round(correct/attempts*100):0)+'%';$('question').textContent=current.q;$('options').replaceChildren(...choices.map(({pair,isCorrect})=>{const b=document.createElement('button');b.className='choice';b.type='button';const jp=document.createElement('strong');jp.lang='ja';jp.textContent=pair[0];const ko=document.createElement('span');ko.textContent='🗣️ '+pair[1];b.append(jp,ko);b.onclick=()=>{if(!$('dialog').hidden)return;answer(isCorrect,b,pair);};return b;}));$('dialog').hidden=true;}
let questionMistakes=0,solved=false;
function lesson(jp,meaning,note){const parts=[...(jp.match(/[一-龯々]+|[ぁ-んァ-ヶー]+/g)||[])].slice(0,4);return (note||'표현 익히기: '+parts.join(' · ')+'\n'+meaning);}
function answer(ok,button,pair){
 if(!$('dialog').hidden||solved||button.disabled)return;
 attempts++;if(ok){correct++;solved=true;}else{questionMistakes++;button.disabled=true;}
 button.classList.add(ok?'good':'bad');
 if(ok){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);}
 $('resultTitle').textContent=ok?(questionMistakes?'🎉 다시 도전해서 정답!':'🎉 정답이다 맹구야!'):'🥹 아깝다! 해석을 보고 다시 골라봐!';
 $('answerJP').textContent=ok?current.a[0]:pair[0];
 $('answerKR').textContent='🗣️ '+(ok?current.a[1]:pair[1]);
 const meaning=ok?current.meaning:(EXPLANATIONS[pair[0]]||'다른 상황에 사용하는 표현이야.');
 $('meaning').textContent=(ok?'✅ 정답: ':'❌ 내가 선택한 표현: ')+meaning+(ok?'':'\n\n팝업을 닫고 남은 보기에서 다시 골라봐!');
 $('vocab').textContent=ok?'📚 단어 공부\n'+lesson(current.a[0],current.meaning,current.note):'📚 표현 공부\n'+lesson(pair[0],meaning,'이 표현은 "'+meaning.split(' · ')[0]+'"라는 의미야. 질문의 상황과 비교해 보자.');
 $('next').textContent=ok?'다음 문제 →':'↩ 다시 도전하기';
 $('score').textContent='정답 '+correct+' / '+attempts;$('fill').style.width=Math.round(correct/Math.max(attempts,1)*100)+'%';
 $('dialog').hidden=false;
}
function advance(){if($('dialog').hidden)return;$('dialog').hidden=true;if(solved)nextQ();} $('next').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();advance();});$('skip').onclick=()=>{if(!solved){alert('맹구야, 이번 문제는 정답까지 맞혀보자! 💙');return;}if(!$('dialog').hidden)$('dialog').hidden=true;nextQ();};renderFilters();resetPool();nextQ();
</script></body></html>
