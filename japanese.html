let category='전체',pool=[],current=null,correct=0,attempts=0,lastId=null;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function resetPool(){pool=shuffle(questions.filter(x=>category==='전체'||x.cat===category).map(x=>x.id));if(pool.length>1&&pool[pool.length-1]===lastId){[pool[0],pool[pool.length-1]]=[pool[pool.length-1],pool[0]];}}
function renderFilters(){let cats=['전체',...new Set(questions.map(q=>q.cat))];$('filters').replaceChildren(...cats.map(c=>{const b=document.createElement('button');b.className='filter'+(c===category?' sel':'');b.textContent=c;b.type='button';b.onclick=()=>{category=c;resetPool();renderFilters();nextQ()};return b;}));}
function nextQ(){if(!pool.length)resetPool();current=questions.find(x=>x.id===pool.pop());lastId=current.id;const choices=shuffle([current.a,current.b,current.c].map((pair,i)=>({pair,isCorrect:i===0})));$('progress').textContent=current.cat+' · '+questions.filter(x=>category==='전체'||x.cat===category).length+'문제 중 랜덤';$('score').textContent='정답 '+correct+' / '+attempts;$('fill').style.width=(attempts?Math.round(correct/attempts*100):0)+'%';$('question').textContent=current.q;$('options').replaceChildren(...choices.map(({pair,isCorrect})=>{const b=document.createElement('button');b.className='choice';b.type='button';const jp=document.createElement('strong');jp.lang='ja';jp.textContent=pair[0];const ko=document.createElement('span');ko.textContent='🗣️ '+pair[1];b.append(jp,ko);b.onclick=()=>answer(isCorrect,b,pair);return b;}));$('dialog').hidden=true;}
function answer(ok,button,pair){attempts++;if(ok)correct++;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);button.classList.add(ok?'good':'bad');$('resultTitle').textContent=ok?'🎉 정답이다 맹구야!':'🥹 아깝다! 정답은 이거야!';$('answerJP').textContent=current.a[0];$('answerKR').textContent='🗣️ '+current.a[1];$('meaning').textContent='💬 뜻: '+current.meaning;$('score').textContent='정답 '+correct+' / '+attempts;$('fill').style.width=Math.round(correct/attempts*100)+'%';$('dialog').hidden=false;$('next').focus();}
$('next').onclick=nextQ;$('skip').onclick=nextQ;renderFilters();resetPool();nextQ();
</script></body></html>
